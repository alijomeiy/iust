services:
  postgres:
    container_name: db
    image: docker.resaa.net/postgres:16
    environment:
      POSTGRES_USER: api
      POSTGRES_PASSWORD: api
      POSTGRES_DB: api
    volumes:
      - ./.data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  rabbitmq:
    image: docker.resaa.net/rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmquser
      RABBITMQ_DEFAULT_PASS: rabbitmqpass
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

  es:
    image: docker.resaa.net/elasticsearch:9.1.5
    container_name: es
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
    environment:
      - node.name=es
      - discovery.type=single-node
      - ELASTIC_PASSWORD=123qwe1!@#QWE
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    mem_limit: 6g
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.resaa.net/kibana:9.1.5
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://192.168.21.81:9200
    ports:
      - "5601:5601"
    volumes:
      - kibanadata:/usr/share/kibana/data
    depends_on:
      - es

  logstash:
    image: docker.resaa.net/logstash:9.1.5
    container_name: logstash
    environment:
      - RABBITMQ_HOST=rabbitmq
      - ES_HOSTS=es:9200
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - rabbitmq
      - es
    restart: always

  spark:
    image: apache/spark:3.5.1
    container_name: spark
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_NO_DAEMONIZE=true
      - ES_HOST=es
      - PG_HOST=db
    command: ["/opt/spark/sbin/start-master.sh"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark_job:/opt/spark/job
    depends_on:
      - es
      - postgres

  # Airflow: orchestration (DAGs for generator + Spark batch)
  airflow-db:
    image: docker.resaa.net/postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off: fix log/dags volume permissions so Airflow (non-root) can write. Runs as root then exits.
  airflow-fix-perms:
    image: busybox:latest
    container_name: airflow-fix-perms
    user: "0"
    environment:
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    command: ["sh", "-c", "mkdir -p /opt/airflow/logs/scheduler /opt/airflow/logs/dag_processor && chown -R $${AIRFLOW_UID}:0 /opt/airflow/logs /opt/airflow/dags"]
    restart: "no"

  airflow:
    image: docker.resaa.net/apache/airflow:2.8.3
    container_name: airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_UID: ${AIRFLOW_UID:-50000}
      _PIP_ADDITIONAL_REQUIREMENTS: docker
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8080"
    command: ["airflow", "standalone"]
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-fix-perms:
        condition: service_completed_successfully
      spark:
        condition: service_started

volumes:
  postgres-db-volume:
  airflow-db-data:
  esdata:
    driver: local
  kibanadata:
    driver: local
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

networks:
  default:
    name: elastic
    external: false

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."