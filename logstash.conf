input {
  rabbitmq {
    id => "telemetry_input"
    host => "rabbitmq"
    port => 5672
    user => "rabbitmquser"
    password => "rabbitmqpass"
    vhost => "/"
    queue => "telemetry_batch"
    durable => true
    ack => true
    prefetch_count => 50
    tags => ["telemetry"]
  }

  rabbitmq {
    id => "heartbeat_input"
    host => "rabbitmq"
    port => 5672
    user => "rabbitmquser"
    password => "rabbitmqpass"
    vhost => "/"
    queue => "device_heartbeat"
    durable => true
    ack => true
    prefetch_count => 10
    tags => ["heartbeat"]
  }

  rabbitmq {
    id => "session_events_input"
    host => "rabbitmq"
    port => 5672
    user => "rabbitmquser"
    password => "rabbitmqpass"
    vhost => "/"
    queue => "session_events"
    durable => true
    ack => true
    prefetch_count => 20
    tags => ["session_events"]
  }
}

filter {
  if "telemetry" in [tags] {
    json {
      source => "message"
    }
    split {
      field => "records"
    }
    mutate {
      rename => { "[records][seq]" => "seq" }
      rename => { "[records][type]" => "record_type" }
      rename => { "[records][device_time]" => "record_device_time" }
      rename => { "[records][data]" => "data" }
      remove_field => ["records"]
    }
  }
  else if "heartbeat" in [tags] {
  }
  else if "session_events" in [tags] {
  }

  mutate {
    add_field => { "received_at" => "%{@timestamp}" }
  }
}

output {
  if "telemetry" in [tags] {
    elasticsearch {
      hosts => ["http://es:9200"]
      index => "telemetry-%{+YYYY.MM.dd}"
    }
  }
  else if "heartbeat" in [tags] {
    elasticsearch {
      hosts => ["http://es:9200"]
      index => "heartbeat-%{+YYYY.MM.dd}"
    }
  }
  else if "session_events" in [tags] {
    elasticsearch {
      hosts => ["http://es:9200"]
      index => "session-events-%{+YYYY.MM.dd}"
    }
  }
}
